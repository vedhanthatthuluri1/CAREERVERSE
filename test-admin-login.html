
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAREERVERSE | Admin Login Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #0b1020;
      color: #f8fafc;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 430px;
      padding: 32px;
      border: 1px solid #273449;
      border-radius: 18px;
      background: #151e30;
      box-shadow: 0 20px 60px #0005;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 27px;
    }

    .subtitle {
      margin-bottom: 28px;
      color: #aab7ca;
      font-size: 14px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #34445e;
      border-radius: 9px;
      outline: none;
      background: #0d1525;
      color: white;
      font-size: 15px;
    }

    input:focus {
      border-color: #60a5fa;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    #result {
      display: none;
      margin-top: 22px;
      padding: 15px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      border-radius: 9px;
      background: #0b1424;
      color: #bfdbfe;
      font-size: 13px;
      line-height: 1.6;
    }

    .note {
      margin-top: 20px;
      color: #8493a9;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>CAREERVERSE</h1>
    <p class="subtitle">Administrator authentication API test — v3.3.2</p>

    <form id="loginForm">
      <label for="username">Admin Username</label>
      <input
        id="username"
        type="text"
        placeholder="Enter admin username"
        autocomplete="username"
        required
      />

      <label for="password">Admin Password</label>
      <input
        id="password"
        type="password"
        placeholder="Enter admin password"
        autocomplete="current-password"
        required
      />

      <button id="submitButton" type="submit">
        Test Admin Login
      </button>
    </form>

    <pre id="result" aria-live="polite"></pre>

    <p class="note">
      Private development test only. Never share your password,
      authentication token, or API response containing credentials.
    </p>
  </main>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbz9csVIVkkhBAvhQhjToYzMgi6Q2uPYTQ8KkKseC3NCPCGDPikfjq8Gn9kB8v2VAp_a6Q/exec";

    const form = document.getElementById("loginForm");
    const button = document.getElementById("submitButton");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      if (!username || !password) {
        showResult("Please enter both username and password.");
        return;
      }

      button.disabled = true;
      button.textContent = "Testing...";
      showResult("Connecting to CAREERVERSE API...");

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            action: "admin.login",
            username,
            password
          })
        });

        const data = await response.json();

        if (data.success) {
          showResult(
            "ADMIN LOGIN TEST SUCCESSFUL\n\n" +
            "The API accepted the login request.\n\n" +
            "Response:\n" +
            JSON.stringify({
              success: data.success,
              message: data.message || "Login successful",
              admin: data.admin || "Authenticated"
            }, null, 2)
          );
        } else {
          showResult(
            "ADMIN LOGIN TEST FAILED\n\n" +
            JSON.stringify({
              success: data.success,
              message: data.message || data.error || "Authentication failed"
            }, null, 2)
          );
        }
      } catch (error) {
        showResult(
          "REQUEST ERROR\n\n" +
          error.message +
          "\n\nCheck the API deployment and browser console."
        );
      } finally {
        button.disabled = false;
        button.textContent = "Test Admin Login";
      }
    });

    function showResult(message) {
      result.style.display = "block";
      result.textContent = message;
    }
  </script>
</body>
</html>
